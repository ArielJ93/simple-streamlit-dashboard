name: maitain aiven mysql alive

on:
  schedule:
    - cron: '22 3,15 * * *'
  
  workflow_dispatch:

jobs:
  sending_script_to_aiven:
    runs-on: ubuntu-latest
    steps:
      - name: download code
        uses: actions/checkout@v4

      - name: python config
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: install mysql
        run: 'pip install PyMySQL streamlit'

      - name: run script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python automate_script.py